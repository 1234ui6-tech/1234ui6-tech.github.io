<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 / 注册</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --blue: #1a73e8;
    --blue-dark: #1557b0;
    --text: #202124;
    --gray: #5f6368;
    --border: #dadce0;
    --bg: #f8fafd;
}

body {
    min-height: 100vh;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    background:
        radial-gradient(circle at 15% 15%, rgba(66,133,244,.15), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(52,168,83,.13), transparent 30%),
        linear-gradient(135deg, #f8fbff, #eef3f8);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

/* =========================
   人机验证
========================= */

.captcha-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 25, 30, .35);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    padding: 20px;
}

.captcha-box {
    width: min(420px, 100%);
    background: rgba(255,255,255,.82);
    border: 1px solid rgba(255,255,255,.7);
    border-radius: 28px;
    padding: 32px;
    box-shadow:
        0 25px 80px rgba(0,0,0,.18),
        inset 0 1px rgba(255,255,255,.9);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    text-align: center;
}

.captcha-box h2 {
    font-size: 25px;
    margin-bottom: 8px;
}

.captcha-box p {
    color: var(--gray);
    font-size: 14px;
    margin-bottom: 22px;
}

.captcha-image {
    height: 90px;
    border-radius: 16px;
    margin-bottom: 16px;
    background:
        repeating-linear-gradient(
            135deg,
            #f0f3f7 0,
            #f0f3f7 3px,
            #e3e7ed 3px,
            #e3e7ed 6px
        );
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
}

.captcha-text {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 9px;
    color: #30343b;
    user-select: none;
    transform: rotate(-2deg);
}

.captcha-input {
    width: 100%;
    height: 52px;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 0 15px;
    font-size: 16px;
    outline: none;
    text-align: center;
    letter-spacing: 4px;
    transition: .2s;
}

.captcha-input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 4px rgba(26,115,232,.12);
}

.captcha-actions {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.captcha-actions button {
    flex: 1;
    height: 48px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    font-weight: 600;
}

.refresh-btn {
    background: #f1f3f4;
    color: #3c4043;
}

.verify-btn {
    background: var(--blue);
    color: white;
}

.captcha-error {
    color: #d93025;
    font-size: 13px;
    margin-top: 12px;
    min-height: 18px;
}

/* =========================
   主卡片
========================= */

.container {
    width: min(460px, 100%);
}

.logo {
    width: 46px;
    height: 46px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4285f4, #1a73e8);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 23px;
    font-weight: 700;
    box-shadow: 0 8px 25px rgba(26,115,232,.25);
}

.card {
    background: rgba(255,255,255,.72);
    border: 1px solid rgba(255,255,255,.85);
    border-radius: 30px;
    padding: 32px;
    box-shadow:
        0 20px 70px rgba(30,50,80,.12),
        inset 0 1px rgba(255,255,255,.9);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
}

.title {
    text-align: center;
    font-size: 28px;
    font-weight: 650;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: var(--gray);
    font-size: 14px;
    margin-bottom: 25px;
}

/* =========================
   登录注册滑动
========================= */

.switch-wrapper {
    position: relative;
    display: flex;
    height: 52px;
    background: rgba(241,243,244,.8);
    border-radius: 16px;
    padding: 4px;
    margin-bottom: 25px;
    overflow: hidden;
}

.switch-slider {
    position: absolute;
    top: 4px;
    left: 4px;
    width: calc(50% - 4px);
    height: 44px;
    border-radius: 13px;
    background: rgba(255,255,255,.95);
    box-shadow:
        0 3px 12px rgba(0,0,0,.10),
        inset 0 1px rgba(255,255,255,.9);
    transition: transform .35s cubic-bezier(.2,.8,.2,1);
}

.switch-slider.register {
    transform: translateX(100%);
}

.switch-btn {
    position: relative;
    z-index: 2;
    flex: 1;
    border: none;
    background: transparent;
    font-size: 15px;
    cursor: pointer;
    color: #5f6368;
    font-weight: 600;
}

/* =========================
   表单
========================= */

.form {
    display: none;
    animation: fadeIn .3s ease;
}

.form.active {
    display: block;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.field {
    margin-bottom: 17px;
}

.field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #3c4043;
}

input,
select {
    width: 100%;
    height: 52px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: rgba(255,255,255,.72);
    padding: 0 15px;
    outline: none;
    font-size: 15px;
    color: var(--text);
    transition: .2s;
}

input:focus,
select:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 4px rgba(26,115,232,.10);
    background: white;
}

.method-switch {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

.method-btn {
    flex: 1;
    height: 42px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: rgba(255,255,255,.65);
    cursor: pointer;
    color: var(--gray);
    font-weight: 600;
}

.method-btn.active {
    background: #e8f0fe;
    color: var(--blue);
    border-color: #c2d7ff;
}

/* 手机号 */

.phone-row {
    display: flex;
    gap: 8px;
}

.country {
    width: 42%;
    flex-shrink: 0;
}

.phone {
    width: 58%;
}

/* 验证码 */

.code-row {
    display: flex;
    gap: 8px;
}

.code-row input {
    flex: 1;
}

.code-btn {
    width: 125px;
    border: none;
    border-radius: 14px;
    background: #e8f0fe;
    color: var(--blue);
    font-weight: 650;
    cursor: pointer;
    transition: .2s;
}

.code-btn:hover {
    background: #d9e7fd;
}

.code-btn:disabled {
    background: #f1f3f4;
    color: #9aa0a6;
    cursor: not-allowed;
}

/* 密码提示 */

.password-hint {
    font-size: 12px;
    color: #70757a;
    margin-top: 7px;
}

.validation {
    font-size: 12px;
    margin-top: 6px;
    min-height: 16px;
}

.validation.error {
    color: #d93025;
}

.validation.success {
    color: #188038;
}

/* 主按钮 */

.submit-btn {
    width: 100%;
    height: 53px;
    border: none;
    border-radius: 15px;
    background: var(--blue);
    color: white;
    font-size: 16px;
    font-weight: 650;
    cursor: pointer;
    margin-top: 5px;
    box-shadow: 0 8px 20px rgba(26,115,232,.22);
    transition: .2s;
}

.submit-btn:hover {
    background: var(--blue-dark);
    transform: translateY(-1px);
}

.footer {
    text-align: center;
    color: #70757a;
    font-size: 12px;
    margin-top: 22px;
}

.hidden {
    display: none !important;
}

.message {
    margin-top: 14px;
    padding: 11px;
    border-radius: 12px;
    font-size: 13px;
    text-align: center;
    display: none;
}

.message.success {
    display: block;
    color: #137333;
    background: #e6f4ea;
}

.message.error {
    display: block;
    color: #c5221f;
    background: #fce8e6;
}

@media(max-width:480px) {
    body {
        padding: 12px;
    }

    .card {
        padding: 23px;
        border-radius: 25px;
    }

    .title {
        font-size: 25px;
    }

    .captcha-box {
        padding: 25px;
    }

    .country {
        width: 44%;
    }

    .phone {
        width: 56%;
    }

    .code-btn {
        width: 110px;
    }
}
</style>
</head>

<body>

<!-- =========================
     人机验证
========================= -->

<div class="captcha-overlay" id="captchaOverlay">

    <div class="captcha-box">

        <h2>验证你的身份</h2>

        <p>
            为了保护账号安全，请输入下方显示的验证码
        </p>

        <div class="captcha-image">
            <span class="captcha-text" id="captchaText"></span>
        </div>

        <input
            id="captchaInput"
            class="captcha-input"
            maxlength="6"
            autocomplete="off"
            placeholder="输入6位数字验证码"
        >

        <div class="captcha-actions">
            <button
                class="refresh-btn"
                onclick="generateCaptcha()">
                换一个
            </button>

            <button
                class="verify-btn"
                onclick="verifyCaptcha()">
                验证
            </button>
        </div>

        <div
            class="captcha-error"
            id="captchaError">
        </div>

    </div>

</div>


<!-- =========================
     主页面
========================= -->

<div class="container">

    <div class="logo">G</div>

    <div class="card">

        <h1 class="title" id="pageTitle">
            登录
        </h1>

        <p class="subtitle">
            使用你的账号继续
        </p>

        <!-- 登录 / 注册 -->

        <div class="switch-wrapper">

            <div
                class="switch-slider"
                id="switchSlider">
            </div>

            <button
                class="switch-btn"
                onclick="switchPage('login')">
                登录
            </button>

            <button
                class="switch-btn"
                onclick="switchPage('register')">
                注册
            </button>

        </div>


        <!-- =========================
             登录
        ========================= -->

        <form
            class="form active"
            id="loginForm"
            onsubmit="return submitLogin(event)">

            <div class="method-switch">

                <button
                    type="button"
                    class="method-btn active"
                    id="loginEmailBtn"
                    onclick="switchMethod('login','email')">
                    邮箱
                </button>

                <button
                    type="button"
                    class="method-btn"
                    id="loginPhoneBtn"
                    onclick="switchMethod('login','phone')">
                    手机号
                </button>

            </div>

            <!-- 登录邮箱 -->

            <div
                class="field"
                id="loginEmailField">

                <label>邮箱</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="name@example.com"
                    autocomplete="email">

            </div>

            <!-- 登录手机号 -->

            <div
                class="field hidden"
                id="loginPhoneField">

                <label>手机号</label>

                <div class="phone-row">

                    <select
                        class="country"
                        id="loginCountry">

                        <option value="+86">🇨🇳 +86</option>
                        <option value="+81">🇯🇵 +81</option>
                        <option value="+82">🇰🇷 +82</option>
                        <option value="+1">🇺🇸 +1</option>
                        <option value="+44">🇬🇧 +44</option>
                        <option value="+61">🇦🇺 +61</option>
                        <option value="+65">🇸🇬 +65</option>
                        <option value="+852">🇭🇰 +852</option>
                        <option value="+886">🇹🇼 +886</option>

                    </select>

                    <input
                        class="phone"
                        id="loginPhone"
                        type="tel"
                        placeholder="请输入手机号"
                        inputmode="numeric">

                </div>

                <div
                    class="validation"
                    id="loginPhoneValidation">
                </div>

            </div>

            <!-- 密码 -->

            <div class="field">

                <label>密码</label>

                <input
                    id="loginPassword"
                    type="password"
                    maxlength="16"
                    placeholder="请输入16位密码"
                    autocomplete="current-password">

            </div>

            <!-- 验证码 -->

            <div class="field">

                <label>验证码</label>

                <div class="code-row">

                    <input
                        id="loginCode"
                        type="text"
                        maxlength="6"
                        placeholder="6位验证码"
                        inputmode="numeric">

                    <button
                        type="button"
                        class="code-btn"
                        id="loginCodeBtn"
                        onclick="sendCode('login')">
                        获取验证码
                    </button>

                </div>

            </div>

            <button
                type="submit"
                class="submit-btn">
                登录
            </button>

            <div
                class="message"
                id="loginMessage">
            </div>

        </form>


        <!-- =========================
             注册
        ========================= -->

        <form
            class="form"
            id="registerForm"
            onsubmit="return submitRegister(event)">

            <div class="method-switch">

                <button
                    type="button"
                    class="method-btn active"
                    id="registerEmailBtn"
                    onclick="switchMethod('register','email')">
                    邮箱
                </button>

                <button
                    type="button"
                    class="method-btn"
                    id="registerPhoneBtn"
                    onclick="switchMethod('register','phone')">
                    手机号
                </button>

            </div>


            <!-- 注册邮箱 -->

            <div
                class="field"
                id="registerEmailField">

                <label>邮箱</label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="name@example.com"
                    autocomplete="email">

            </div>


            <!-- 注册手机号 -->

            <div
                class="field hidden"
                id="registerPhoneField">

                <label>手机号</label>

                <div class="phone-row">

                    <select
                        class="country"
                        id="registerCountry">

                        <option value="+86">🇨🇳 +86</option>
                        <option value="+81">🇯🇵 +81</option>
                        <option value="+82">🇰🇷 +82</option>
                        <option value="+1">🇺🇸 +1</option>
                        <option value="+44">🇬🇧 +44</option>
                        <option value="+61">🇦🇺 +61</option>
                        <option value="+65">🇸🇬 +65</option>
                        <option value="+852">🇭🇰 +852</option>
                        <option value="+886">🇹🇼 +886</option>

                    </select>

                    <input
                        class="phone"
                        id="registerPhone"
                        type="tel"
                        placeholder="请输入手机号"
                        inputmode="numeric">

                </div>

                <div
                    class="validation"
                    id="registerPhoneValidation">
                </div>

            </div>


            <!-- 注册密码 -->

            <div class="field">

                <label>设置密码</label>

                <input
                    id="registerPassword"
                    type="password"
                    maxlength="16"
                    placeholder="16位字母+数字"
                    autocomplete="new-password">

                <div class="password-hint">
                    必须正好16位，并且同时包含字母和数字
                </div>

                <div
                    class="validation"
                    id="passwordValidation">
                </div>

            </div>


            <!-- 注册验证码 -->

            <div class="field">

                <label>验证码</label>

                <div class="code-row">

                    <input
                        id="registerCode"
                        type="text"
                        maxlength="6"
                        placeholder="6位验证码"
                        inputmode="numeric">

                    <button
                        type="button"
                        class="code-btn"
                        id="registerCodeBtn"
                        onclick="sendCode('register')">
                        获取验证码
                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="submit-btn">
                创建账号
            </button>

            <div
                class="message"
                id="registerMessage">
            </div>

        </form>


        <div class="footer">
            继续使用即表示你同意相关服务条款和隐私政策
        </div>

    </div>

</div>


<script>

/* =====================================================
   人机验证码
===================================================== */

let captchaCode = "";

function generateCaptcha() {

    captchaCode = String(
        Math.floor(100000 + Math.random() * 900000)
    );

    document.getElementById("captchaText").textContent =
        captchaCode;

    document.getElementById("captchaInput").value = "";

    document.getElementById("captchaError").textContent = "";
}

function verifyCaptcha() {

    const input =
        document.getElementById("captchaInput")
        .value
        .trim();

    if (/^\d{6}$/.test(input)) {

        document.getElementById("captchaOverlay")
            .classList.add("hidden");

    } else {

        document.getElementById("captchaError")
            .textContent =
            "验证码错误，请重新输入";

        generateCaptcha();
    }
}

generateCaptcha();


/* =====================================================
   登录 / 注册切换
===================================================== */

function switchPage(page) {

    const loginForm =
        document.getElementById("loginForm");

    const registerForm =
        document.getElementById("registerForm");

    const slider =
        document.getElementById("switchSlider");

    const title =
        document.getElementById("pageTitle");

    if (page === "login") {

        loginForm.classList.add("active");
        registerForm.classList.remove("active");

        slider.classList.remove("register");

        title.textContent = "登录";

    } else {

        registerForm.classList.add("active");
        loginForm.classList.remove("active");

        slider.classList.add("register");

        title.textContent = "注册";
    }
}


/* =====================================================
   邮箱 / 手机号切换
===================================================== */

function switchMethod(type, method) {

    const emailField =
        document.getElementById(
            type + "EmailField"
        );

    const phoneField =
        document.getElementById(
            type + "PhoneField"
        );

    const emailBtn =
        document.getElementById(
            type + "EmailBtn"
        );

    const phoneBtn =
        document.getElementById(
            type + "PhoneBtn"
        );

    if (method === "email") {

        emailField.classList.remove("hidden");
        phoneField.classList.add("hidden");

        emailBtn.classList.add("active");
        phoneBtn.classList.remove("active");

    } else {

        emailField.classList.add("hidden");
        phoneField.classList.remove("hidden");

        emailBtn.classList.remove("active");
        phoneBtn.classList.add("active");
    }
}


/* =====================================================
   手机号验证
===================================================== */

/*
    这里使用不同国家的基础号码长度规则。

    注意：
    真正生产环境建议后端使用 Google libphonenumber
    或其他成熟手机号库再次验证。
*/

const phoneRules = {

    // 中国大陆：11位手机号，以1开头，第二位3-9
    "+86": { regex: /^1[3-9]\d{9}$/, digits: 11, label: "中国大陆" },

    // 日本：常见移动号码 10-11 位（070/080/090）
    "+81": { regex: /^(070|080|090)\d{8}$/, digits: 11, label: "日本" },

    // 韩国：常见移动号码 10-11 位（01x）
    "+82": { regex: /^01[016789]\d{7,8}$/, minDigits: 10, maxDigits: 11, label: "韩国" },

    // 美国/加拿大 NANP：10位本地号码
    "+1": { regex: /^[2-9]\d{9}$/, digits: 10, label: "美国/加拿大" },

    // 英国：国际区号 +44 后常见移动号码 10位
    "+44": { regex: /^7\d{9}$/, digits: 10, label: "英国" },

    // 澳大利亚：移动号码 9位（区号 +61 后）
    "+61": { regex: /^4\d{8}$/, digits: 9, label: "澳大利亚" },

    // 新加坡：8位
    "+65": { regex: /^[689]\d{7}$/, digits: 8, label: "新加坡" },

    // 中国香港：8位
    "+852": { regex: /^[5-9]\d{7}$/, digits: 8, label: "中国香港" },

    // 中国台湾：9位移动号码
    "+886": /^9\d{8}$/
};

function validatePhone(countryId, phoneId, validationId) {

    const country =
        document.getElementById(countryId).value;

    const phone =
        document.getElementById(phoneId)
        .value
        .replace(/\s/g, "");

    const validation =
        document.getElementById(validationId);

    if (!phone) {

        validation.textContent =
            "请输入手机号";

        validation.className =
            "validation error";

        return false;
    }

    const rule = phoneRules[country];
    const regex = rule && (rule.regex || rule);
    const expectedDigits = rule && rule.digits;
    const minDigits = rule && rule.minDigits;
    const maxDigits = rule && rule.maxDigits;

    if (
        !regex ||
        !regex.test(phone) ||
        (expectedDigits && phone.length !== expectedDigits) ||
        (minDigits && phone.length < minDigits) ||
        (maxDigits && phone.length > maxDigits)
    ) {

        validation.textContent =
            expectedDigits
                ? "请输入" + expectedDigits + "位手机号"
                : "手机号格式不正确";

        validation.className =
            "validation error";

        return false;
    }

    validation.textContent =
        "手机号格式正确";

    validation.className =
        "validation success";

    return true;
}


/* =====================================================
   密码验证
===================================================== */

function validatePassword() {

    const password =
        document.getElementById("registerPassword")
        .value;

    const validation =
        document.getElementById("passwordValidation");

    /*
        必须：
        1. 16位
        2. 至少一个字母
        3. 至少一个数字
    */

    const valid =
        /^[A-Za-z0-9]{16}$/.test(password) &&
        /[A-Za-z]/.test(password) &&
        /\d/.test(password);

    if (!valid) {

        validation.textContent =

    }

    validation.className =

    return true;
}

document

        "input",
        validatePassword
    );


/* =====================================================
   获取验证码
===================================================== */

const countdowns = {
    login: 0,
    register: 0
};

const verificationCodes = {
    login: "",
    register: ""
};

function getTarget(type) {

    const form =
        document.getElementById(
            type + "Form"
        );

    const emailField =
        document.getElementById(
            type + "EmailField"
        );

    const isEmail =
        !emailField.classList.contains("hidden");

    if (isEmail) {

        const email =
            document.getElementById(
                type + "Email"
            ).value.trim();

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {

            showMessage(
                type,
                "请输入正确的邮箱地址",
                "error"
            );

            return null;
        }

        return email;

    } else {

        const valid = validatePhone(
            type + "Country",
            type + "Phone",
            type + "PhoneValidation"
        );

        if (!valid) {

            showMessage(
                type,
                "请先输入正确的手机号",
                "error"
            );

            return null;
        }

        const country =
            document.getElementById(
                type + "Country"
            ).value;

        const phone =
            document.getElementById(
                type + "Phone"
            ).value
            .replace(/\s/g, "");

        return country + phone;
    }
}

function sendCode(type) {

    if (countdowns[type] > 0) {
        return;
    }

    const target = getTarget(type);

    if (!target) {
        return;
    }

    /*
        生成演示验证码
        生产环境必须由服务器生成并发送。
    */

    verificationCodes[type] =
        String(
            Math.floor(
                100000 +
                Math.random() * 900000
            )
        );

    console.log(
        "【演示】发送验证码到:",
        target,
        "验证码:",
        verificationCodes[type]
    );

    showMessage(
        type,
        "验证码已发送（演示模式请查看控制台）",
        "success"
    );

    countdowns[type] = 120;

    const button =
        document.getElementById(
            type + "CodeBtn"
        );

    button.disabled = true;

    button.textContent =
        `重新获取 (${countdowns[type]}s)`;

    const timer =
        setInterval(() => {

            countdowns[type]--;

            button.textContent =
                countdowns[type] > 0
                ? `重新获取 (${countdowns[type]}s)`
                : "获取验证码";

            if (countdowns[type] <= 0) {

                clearInterval(timer);

                button.disabled = false;
            }

        }, 1000);
}


/* =====================================================
   登录
===================================================== */

function submitLogin(event) {

    event.preventDefault();

    const emailField =
        document.getElementById("loginEmailField");

    const isEmail =
        !emailField.classList.contains("hidden");

    let targetValid = false;

    if (isEmail) {

        const email =
            document.getElementById("loginEmail")
            .value
            .trim();

        targetValid =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

    } else {

        targetValid = validatePhone(
            "loginCountry",
            "loginPhone",
            "loginPhoneValidation"
        );
    }

    const password =
        document.getElementById("loginPassword")
        .value;

    const code =
        document.getElementById("loginCode")
        .value
        .trim();

    if (!targetValid) {

        showMessage(
            "login",
            "请输入正确的邮箱或手机号",
            "error"
        );

        return false;
    }

    if (!/^[A-Za-z0-9]{16}$/.test(password)) {

        showMessage(
            "login",
            "密码必须是16位字母和数字",
            "error"
        );

        return false;
    }

    if (code !== verificationCodes.login) {

        showMessage(
            "login",
            "验证码错误",
            "error"
        );

        return false;
    }

    // 只有用户手动点击“登录”按钮并通过校验后，才显示登录成功。
    showLoginSuccessPopup();

    return false;
}


/* =====================================================
   注册
===================================================== */

function submitRegister(event) {

    event.preventDefault();

    const emailField =
        document.getElementById("registerEmailField");

    const isEmail =
        !emailField.classList.contains("hidden");

    let targetValid = false;

    if (isEmail) {

        const email =
            document.getElementById("registerEmail")
            .value
            .trim();

        targetValid =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

    } else {

        targetValid = validatePhone(
            "registerCountry",
            "registerPhone",
            "registerPhoneValidation"
        );
    }

    const passwordValid =
        validatePassword();

    const code =
        document.getElementById("registerCode")
        .value
        .trim();

    if (!targetValid) {

        showMessage(
            "register",
            "请输入正确的邮箱或手机号",
            "error"
        );

        return false;
    }

    if (!passwordValid) {

        showMessage(
            "register",
            "密码格式不符合要求",
            "error"
        );

        return false;
    }

    if (code !== verificationCodes.register) {

        showMessage(
            "register",
            "验证码错误",
            "error"
        );

        return false;
    }

    showMessage(
        "register",
        "注册验证成功！这是前端演示页面。",
        "success"
    );

    return false;
}


/* =====================================================
   消息提示
===================================================== */

function showMessage(type, text, status) {

    const message =
        document.getElementById(
            type + "Message"
        );

    message.textContent = text;

    message.className =
        "message " + status;

    setTimeout(() => {

        message.className =
            "message";

    }, 4000);
}

                showPassword: "Passwort anzeigen",

                captchaTitle: "Identität bestätigen",

                captchaPlaceholder: "6-stelligen Code eingeben",
                captchaRefresh: "Neuer Code",
                captchaVerify: "Überprüfen"
            };

            /* 原数组里如果存在 ar，则换成 de */
            if (Array.isArray(languages)) {
                const i = languages.indexOf("ar");
                if (i !== -1) languages[i] = "de";
            }
        }

        /* 如果原语言菜单已经创建，则把阿拉伯语选项显示为德语 */
        const menu = document.getElementById("addedLanguageMenu");
        if (menu) {
            const buttons = menu.querySelectorAll("button");
            buttons.forEach(btn => {
                if (btn.dataset.lang === "ar") {
                    btn.dataset.lang = "de";
                    btn.textContent = "Deutsch";
                    btn.onclick = function () {
                        changeAddedLanguage("de");
                        menu.classList.remove("show");
                    };
                }
            });
        }

        /* 旧的 ar 本地记录改成 de，避免刷新后继续显示阿拉伯语 */
        if (localStorage.getItem("addedLanguage") === "ar") {
            localStorage.setItem("addedLanguage", "de");
        }

        updateManualLanguage();
    }

            close.type = "button";
            close.textContent = "确定";
            close.addEventListener("click", function () {
                overlay.classList.remove("show");
            });

            box.appendChild(title);
            box.appendChild(message);
            box.appendChild(close);
            overlay.appendChild(box);
            document.body.appendChild(overlay);
        }

        overlay.classList.add("show");
    }

    window.showLoginSuccessPopup = showLoginSuccessPopup;
})();
</script>

<script id="captcha-donation-popup-script">
(function () {
    "use strict";

    const qrImageFile = "mm_facetoface_collect_qrcode_1790330524146.png";
    let lastCaptchaVisible = null;

    function createInvestmentPopup() {
        if (document.getElementById("addedInvestmentOverlay")) return;

        const overlay = document.createElement("div");
        overlay.id = "addedInvestmentOverlay";

        const box = document.createElement("div");
        box.id = "addedInvestmentBox";
        box.setAttribute("role", "dialog");
        box.setAttribute("aria-label", "制作不易，捐款支持");

        const x = document.createElement("button");
        x.id = "addedInvestmentX";
        x.type = "button";
        x.textContent = "×";
        x.setAttribute("aria-label", "关闭捐款支持弹窗");

        const title = document.createElement("div");
        title.id = "addedInvestmentTitle";
        title.textContent = "制作不易，捐款支持";

        const text = document.createElement("div");
        text.id = "addedInvestmentText";
        text.textContent = "感谢你的支持。如果愿意，可以通过下方二维码支持本项目。";

        const img = document.createElement("img");
        img.id = "addedInvestmentQr";
        img.src = qrImageFile;
        img.alt = "捐款二维码";
        img.onerror = function () {
            this.style.display = "none";
            text.textContent = "二维码图片未找到，请将 " + qrImageFile + " 放在网页同一目录后刷新页面。";
        };

        const close = document.createElement("button");
        close.id = "addedInvestmentClose";
        close.type = "button";
        close.textContent = "关闭";

        x.addEventListener("click", function () {
            closeInvestmentPopup();
        });

        close.addEventListener("click", function () {
            closeInvestmentPopup();
        });

        box.appendChild(x);
        box.appendChild(title);
        box.appendChild(text);
        box.appendChild(img);
        box.appendChild(close);
        overlay.appendChild(box);
        document.body.appendChild(overlay);
    }

    function openInvestmentPopup() {
        createInvestmentPopup();
        const overlay = document.getElementById("addedInvestmentOverlay");
        if (overlay) overlay.classList.add("show");
    }

    function closeInvestmentPopup() {
        const overlay = document.getElementById("addedInvestmentOverlay");
        if (overlay) overlay.classList.remove("show");
    }

    function getCaptchaVisible() {
        const captcha = document.getElementById("captchaOverlay");
        return !!captcha && !captcha.classList.contains("hidden");
    }

    function syncWithCaptcha(force) {
        const visible = getCaptchaVisible();

        if (lastCaptchaVisible === null) {
            lastCaptchaVisible = visible;
            if (visible) {
                    openInvestmentPopup();
            } else {
                closeInvestmentPopup();
            }
            return;
        }

        if (visible === lastCaptchaVisible && !force) {
            return;
        }

        lastCaptchaVisible = visible;

        if (visible) {
            openInvestmentPopup();
        } else {
            closeInvestmentPopup();
        }
    }

    function init() {
        createInvestmentPopup();

        const captcha = document.getElementById("captchaOverlay");
        if (!captcha) return;

        syncWithCaptcha(false);

        new MutationObserver(function () {
            const visible = getCaptchaVisible();
            if (visible !== lastCaptchaVisible) {
                syncWithCaptcha(false);
            }
        }).observe(captcha, {
            attributes: true,
            attributeFilter: ["class"]
        });

        window.addEventListener("keydown", function (event) {
            if (event.key === "Escape" && getCaptchaVisible()) {
                closeInvestmentPopup();
            }
        });

    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
    } else {
        init();
    }
})();
</script>
